<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Updating Electron</title>
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      background: transparent; /* Ensure transparent background for window */
      border: none; /* Remove any potential borders */
      overflow: hidden; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    /* Grey rounded container */
    .container { 
      background: #1e1e1e; 
      border-radius: 32px; 
      padding: 60px; 
      width: 1000px; 
      min-width: 700px; 
      max-width: 95%; 
      min-height: 600px; 
      text-align: center; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.5); 
      position: relative; 
      z-index: 1; 
      box-sizing: border-box; 
      overflow: auto; 
    }
    .logo { 
      width: 120px; 
      height: 120px; 
      margin: 0 auto 40px; 
      display: block; 
      object-fit: contain; 
    }
    .spinner { 
      border: 8px solid rgba(255,255,255,0.2); 
      border-top: 8px solid #0a84ff; 
      border-radius: 50%; 
      width: 80px; 
      height: 80px; 
      animation: spin 1s linear infinite; 
      margin: 20px auto; 
    }
    
    .update-logo {
      display: none;
      position: relative;
      width: 80px;
      height: 80px;
      margin: 20px auto;
    }
    
    .update-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      color: #0a84ff;
      z-index: 3;
      animation: updatePulse 2s ease-in-out infinite;
    }
    
    .update-icon svg {
      width: 100%;
      height: 100%;
    }
    
    .update-rings {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    
    .ring {
      position: absolute;
      border: 2px solid #0a84ff;
      border-radius: 50%;
      opacity: 0;
    }
    
    .ring-1 {
      width: 80px;
      height: 80px;
      top: 0;
      left: 0;
      animation: ringExpand 2s ease-out infinite;
    }
    
    .ring-2 {
      width: 80px;
      height: 80px;
      top: 0;
      left: 0;
      animation: ringExpand 2s ease-out infinite 0.5s;
    }
    
    .ring-3 {
      width: 80px;
      height: 80px;
      top: 0;
      left: 0;
      animation: ringExpand 2s ease-out infinite 1s;
    }
    @keyframes spin { 
      0% { transform: rotate(0deg); } 
      100% { transform: rotate(360deg); } 
    }
    
    @keyframes updatePulse {
      0%, 100% { 
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
      50% { 
        transform: translate(-50%, -50%) scale(1.1);
        opacity: 0.8;
      }
    }
    
    @keyframes ringExpand {
      0% {
        transform: scale(0.8);
        opacity: 1;
      }
      100% {
        transform: scale(1.4);
        opacity: 0;
      }
    }
    #status { 
      margin-top: 32px; 
      font-size: 20px; 
      color: #ffffff; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
      font-weight: 500; 
      line-height: 1.5; 
      z-index: 2; 
      position: relative; 
      text-shadow: 0 1px 2px rgba(0,0,0,0.5); 
    }
    
    .progress-container {
      margin-top: 24px;
      width: 100%;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }
    
    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.3);
    }
    
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0a84ff, #007aff, #5ac8fa);
      border-radius: 4px;
      transition: width 0.3s ease-out;
      position: relative;
      overflow: hidden;
    }
    
    .progress-fill::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      animation: progressShine 2s infinite;
    }
    
    .progress-text {
      margin-top: 12px;
      font-size: 16px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    
    .version-info {
      margin-top: 8px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
      opacity: 0.8;
    }
    
    @keyframes progressShine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Verify path in Electron; adjust if needed or use base64 -->
    <img src="../../logo/Nuru.png" class="logo" alt="Nuru Browser Logo">
    <div class="spinner" id="spinner"></div>
    <div class="update-logo" id="update-logo">
      <div class="update-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L13.09 8.26L19 7L14.74 12L19 17L13.09 15.74L12 22L10.91 15.74L5 17L9.26 12L5 7L10.91 8.26L12 2Z" fill="currentColor"/>
        </svg>
      </div>
      <div class="update-rings">
        <div class="ring ring-1"></div>
        <div class="ring ring-2"></div>
        <div class="ring ring-3"></div>
      </div>
    </div>
    <div id="status">Updating Nuru Browser</div>
    <div id="version-info" class="version-info"></div>
    <div class="progress-container" id="progress-container" style="display: none;">
      <div class="progress-bar" id="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-text" id="progress-text">0%</div>
    </div>
  </div>
  <script src="update-modal.js"></script>
</body>
</html>
