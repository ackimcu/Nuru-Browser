<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuru Browser - Start Page</title>
    <link rel="stylesheet" href="start-page.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#6366F1">
</head>
<body>
    <div class="start-page-container" data-theme="auto">
        <!-- Dynamic Background -->
        <div class="background-container">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
            <div class="noise-texture"></div>
        </div>


        <!-- Main Content -->
        <main class="start-main" role="main">
            <!-- Greeting Section -->
            <section class="greeting-section" aria-label="Welcome greeting">
                <div class="greeting-container">
                    <h1 class="dynamic-greeting" id="dynamic-greeting">Good morning</h1>
                    <p class="greeting-subtitle" id="greeting-subtitle">Ready to explore the web?</p>
                </div>
            </section>

            <!-- Hero Section with Search -->
            <section class="hero-section" aria-label="Search and navigation">
                <div class="hero-content">
                    
                </div>
            </section>

            <!-- Smart Widgets Grid -->
            <section class="widgets-section" aria-label="Quick access widgets">
                <div class="widgets-grid">
                    <!-- Time & Weather Widget -->
                    <div class="widget time-weather-widget" role="region" aria-label="Time and weather information">
                        <div class="widget-header">
                            <h3 class="widget-title">Now</h3>
                            <button class="widget-refresh" id="weather-refresh" aria-label="Refresh weather" title="Refresh">
                                <i class="fas fa-arrow-clockwise" aria-hidden="true"></i>
                            </button>
                        </div>
                        <div class="widget-content">
                            <div class="time-display" id="time-display" aria-live="polite">--:--</div>
                            <div class="date-display" id="date-display">-- --, ----</div>
                            <div class="weather-info" id="weather-info">
                                <div class="weather-temp" id="weather-temp">--°</div>
                                <div class="weather-desc" id="weather-desc">--</div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions Widget -->
                    <div class="widget quick-actions-widget" role="region" aria-label="Quick browser actions">
                        <div class="widget-header">
                            <h3 class="widget-title">Quick Actions</h3>
                        </div>
                        <div class="widget-content">
                            <div class="actions-grid">
                                <button class="action-btn" id="new-tab-btn" aria-label="Open new tab">
                                    <i class="fas fa-plus" aria-hidden="true"></i>
                                    <span>New Tab</span>
                                </button>
                                <button class="action-btn" id="bookmark-page-btn" aria-label="Bookmark current page">
                                    <i class="fas fa-bookmark" aria-hidden="true"></i>
                                    <span>Bookmark</span>
                                </button>
                                <button class="action-btn" id="downloads-btn" aria-label="Show downloads">
                                    <i class="fas fa-download" aria-hidden="true"></i>
                                    <span>Downloads</span>
                                </button>
                                <button class="action-btn" id="reading-mode-btn" aria-label="Toggle reading mode">
                                    <i class="fas fa-book-open" aria-hidden="true"></i>
                                    <span>Reading</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Productivity Widget -->
                    <div class="widget productivity-widget" role="region" aria-label="Productivity tools">
                        <div class="widget-header">
                            <h3 class="widget-title">Productivity</h3>
                        </div>
                        <div class="widget-content">
                            <div class="productivity-items">
                                <button class="productivity-item" id="screenshot-btn" aria-label="Take screenshot">
                                    <i class="fas fa-camera" aria-hidden="true"></i>
                                    <span>Screenshot</span>
                                </button>
                                <button class="productivity-item" id="clear-cache-btn" aria-label="Clear browser cache">
                                    <i class="fas fa-broom" aria-hidden="true"></i>
                                    <span>Clear Cache</span>
                                </button>
                                <button class="productivity-item" id="incognito-btn" aria-label="Open incognito window">
                                    <i class="fas fa-mask" aria-hidden="true"></i>
                                    <span>Incognito</span>
                                </button>
                                <button class="productivity-item" id="dev-tools-btn" aria-label="Open developer tools">
                                    <i class="fas fa-code" aria-hidden="true"></i>
                                    <span>Dev Tools</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Smart Bookmarks & Recent Sites -->
            <section class="bookmarks-section" aria-label="Bookmarks and recent sites">
                <div class="section-header">
                    <h2 class="section-title">Favorites & Recent</h2>
                    <div class="section-actions">
                        <button class="section-btn" id="add-bookmark-btn" aria-label="Add bookmark" title="Add Bookmark">
                            <i class="fas fa-plus" aria-hidden="true"></i>
                        </button>
                        <button class="section-btn" id="manage-bookmarks-btn" aria-label="Manage bookmarks" title="Manage">
                            <i class="fas fa-gear" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="bookmarks-grid" id="bookmarks-grid" role="grid" aria-label="Bookmarks and recent sites">
                    <!-- Bookmarks will be populated dynamically -->
                </div>
            </section>


            <!-- Recent Activity -->
            <section class="activity-section" aria-label="Recent activity">
                <div class="section-header">
                    <h2 class="section-title">Recent Activity</h2>
                    <div class="section-actions">
                        <button class="section-btn" id="clear-activity-btn" aria-label="Clear activity" title="Clear">
                            <i class="fas fa-trash" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>
                <div class="activity-list" id="activity-list" role="list" aria-label="Recent activity list">
                    <!-- Activity items will be populated dynamically -->
                </div>
            </section>
        </main>

        <!-- Minimal Footer -->
        <footer class="start-footer" role="contentinfo">
            <div class="footer-content">
                <div class="footer-brand">
                    <span class="brand-text">Nuru Browser</span>
                    <span class="version-badge">v1.0.0</span>
                </div>
                <div class="footer-actions">
                    <button class="footer-action" id="help-btn" aria-label="Get help">Help</button>
                    <button class="footer-action" id="about-btn" aria-label="About Nuru Browser">About</button>
                    <button class="footer-action" id="feedback-btn" aria-label="Send feedback">Feedback</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- Enhanced Add Bookmark Modal -->
    <div class="modal-overlay" id="add-bookmark-modal" role="dialog" aria-labelledby="modal-title" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add Bookmark</h3>
                <button class="modal-close" id="modal-close" aria-label="Close modal">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="bookmark-name">Name</label>
                    <input type="text" id="bookmark-name" placeholder="Enter bookmark name" required>
                </div>
                <div class="form-group">
                    <label for="bookmark-url">URL</label>
                    <input type="url" id="bookmark-url" placeholder="https://example.com" required>
                </div>
                <div class="form-group">
                    <label for="bookmark-icon">Icon</label>
                    <div class="icon-picker">
                        <button type="button" class="icon-option active" data-icon="fas fa-globe">
                            <i class="fas fa-globe"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-newspaper">
                            <i class="fas fa-newspaper"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-shopping-cart">
                            <i class="fas fa-shopping-cart"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-graduation-cap">
                            <i class="fas fa-graduation-cap"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-gamepad">
                            <i class="fas fa-gamepad"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-music">
                            <i class="fas fa-music"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-video">
                            <i class="fas fa-video"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-code">
                            <i class="fas fa-code"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-palette">
                            <i class="fas fa-palette"></i>
                        </button>
                        <button type="button" class="icon-option" data-icon="fas fa-chart-line">
                            <i class="fas fa-chart-line"></i>
                        </button>
                    </div>
                    <input type="hidden" id="bookmark-icon" value="fas fa-globe">
                </div>
                <div class="form-group">
                    <label for="bookmark-folder">Folder</label>
                    <select id="bookmark-folder">
                        <option value="general">General</option>
                        <option value="work">Work</option>
                        <option value="personal">Personal</option>
                        <option value="entertainment">Entertainment</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="modal-save">Save Bookmark</button>
            </div>
        </div>
    </div>

    <!-- Quick Note Modal -->
    <div class="modal-overlay" id="note-modal" role="dialog" aria-labelledby="note-modal-title" aria-hidden="true">
        <div class="modal-content note-modal">
            <div class="modal-header">
                <h3 id="note-modal-title">Quick Note</h3>
                <button class="modal-close" id="note-modal-close" aria-label="Close modal">
                    <i class="fas fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <textarea id="note-content" placeholder="Write your note here..." rows="6"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="note-modal-cancel">Cancel</button>
                <button class="btn btn-primary" id="note-modal-save">Save Note</button>
            </div>
        </div>
    </div>


    <script src="start-page.js"></script>
</body>
</html>
